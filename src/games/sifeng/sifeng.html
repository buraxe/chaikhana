<body>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="g花" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d23c2e"/><stop offset=".35" stop-color="#c08c00"/><stop offset=".65" stop-color="#23885a"/><stop offset="1" stop-color="#2a62b8"/></linearGradient>
</defs></svg>
<div id="app"></div>
<script>
"use strict";
//ENGINE-START
const COLORS=['#d23c2e','#23885a','#2a62b8','#c08c00'];
const SUITS=['筒','条','万','风'];
const NUMS=['一','二','三','四'];
const WINDS=['东','南','西','北'];
const K=(x,y)=>x+','+y;
const P=k=>k.split(',').map(Number);
const D4=[[1,0],[-1,0],[0,1],[0,-1]];
const IDENT=[];for(let s=0;s<4;s++)for(let n=1;n<=4;n++)for(let c=0;c<4;c++)IDENT.push({s,n,c});
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeDeck(half){
  let d=[],id=0;
  for(let s=0;s<4;s++)for(let n=1;n<=4;n++)for(let c=0;c<4;c++)d.push({id:id++,s,n,c,j:false});
  shuffle(d);
  const jk=[{id:64,j:true},{id:65,j:true}];
  if(half){d=d.slice(0,32);d.push(jk[0])}else d.push(...jk);
  return shuffle(d);
}
function runAt(m,x,y,dx,dy){
  let sx=x,sy=y;while(m[K(sx-dx,sy-dy)]){sx-=dx;sy-=dy}
  const out=[];let cx=sx,cy=sy;while(m[K(cx,cy)]){out.push([cx,cy]);cx+=dx;cy+=dy}
  return out;
}
function lineFail(cs){
  const L=cs.length;if(L>4)return 'long';
  for(const a of ['c','s','n']){const n=new Set(cs.map(x=>x[a])).size;if(n!==1&&n!==L)return a}
  return null;
}
// lines: arrays of cards. Jokers (j:true) must take one identity valid in every line they belong to.
function checkLines(lines){
  for(const l of lines)if(l.length>4)return {ok:false,why:'long'};
  const noJ=lines.filter(l=>!l.some(c=>c.j)),withJ=lines.filter(l=>l.some(c=>c.j));
  for(const l of noJ){const f=lineFail(l);if(f)return {ok:false,why:f}}
  if(!withJ.length)return {ok:true};
  const jids=[...new Set(withJ.flat().filter(c=>c.j).map(c=>c.id))];
  const asg={};const res=c=>c.j?asg[c.id]:c;
  const rec=i=>{
    if(i===jids.length)return withJ.every(l=>!lineFail(l.map(res)));
    for(const id of IDENT){asg[jids[i]]=id;
      // prune: lines whose jokers are all assigned
      const done=new Set(jids.slice(0,i+1));
      if(withJ.every(l=>l.some(c=>c.j&&!done.has(c.id))||!lineFail(l.map(res)))&&rec(i+1))return true}
    return false;
  };
  if(rec(0))return {ok:true};
  // report a helpful reason if possible
  return {ok:false,why:'joker'};
}
function addRun(map,m,x,y,dx,dy){const r=runAt(m,x,y,dx,dy);if(r.length<2)return;const key=(dx?'h':'v')+K(r[0][0],r[0][1]);if(!map.has(key))map.set(key,r)}
function jokerLines(m,map){for(const key in m)if(m[key].j){const [x,y]=P(key);addRun(map,m,x,y,1,0);addRun(map,m,x,y,0,1)}}
// pend: [{x,y,card}]
function analyze(board,pend,opt){
  opt=opt||{};
  if(!pend.length)return {ok:false,why:'empty'};
  const m=Object.assign({},board);
  for(const p of pend){const k=K(p.x,p.y);if(m[k])return {ok:false,why:'occupied'};m[k]=p.card}
  // house rule: tiles may go into any number of lines; each new tile must reach the table
  // directly or through other new tiles
  const pk=new Set(pend.map(p=>K(p.x,p.y))),seen=new Set(),q=[];
  for(const p of pend)if(D4.some(([dx,dy])=>board[K(p.x+dx,p.y+dy)])){seen.add(K(p.x,p.y));q.push([p.x,p.y])}
  while(q.length){const [x,y]=q.pop();for(const [dx,dy] of D4){const k=K(x+dx,y+dy);if(pk.has(k)&&!seen.has(k)){seen.add(k);q.push([x+dx,y+dy])}}}
  if(seen.size!==pk.size)return {ok:false,why:'connect'};
  const aff=new Map();
  for(const p of pend){addRun(aff,m,p.x,p.y,1,0);addRun(aff,m,p.x,p.y,0,1)}
  const all=new Map(aff);jokerLines(m,all);
  const chk=checkLines([...all.values()].map(r=>r.map(([x,y])=>m[K(x,y)])));
  if(!chk.ok)return chk;
  const lines=[...aff.values()];
  let base=0,teams=0;
  for(const r of lines){for(const [x,y] of r){const c=m[K(x,y)];if(!c.j)base+=c.n}if(r.length===4)teams++}
  if(opt.must3&&!lines.some(r=>r.length>=3))return {ok:false,why:'must3'};
  // per-line sums (for the "pairs score nothing" rule) and tiles sitting in a 3+ row AND a 3+ column
  const sums=lines.map(r=>({len:r.length,pts:r.reduce((a,[x,y])=>a+(m[K(x,y)].j?0:m[K(x,y)].n),0)}));
  const cross=pend.filter(p=>runAt(m,p.x,p.y,1,0).length>=3&&runAt(m,p.x,p.y,0,1).length>=3).length;
  return {ok:true,lines,base,teams,sums,cross};
}
// Is (x,y) open for placement at all? Only closed when it would make a row or column
// longer than 4; whether the tile itself fits is reported after placing it.
function cellOpen(m,x,y){
  const k=K(x,y);if(m[k])return false;
  const m2=Object.assign({},m);m2[k]={id:'probe'};
  return runAt(m2,x,y,1,0).length<=4&&runAt(m2,x,y,0,1).length<=4;
}
// Can any tile ever go to empty cell (x,y)? False when it would make a line longer than 4
// (e.g. 2 tiles · gap · 2 tiles) or when no tile identity fits the lines through it.
function cellAlive(m,x,y){
  const k=K(x,y);if(m[k])return false;
  const probe={id:'probe'},m2=Object.assign({},m);m2[k]=probe;
  const runs=[];
  for(const [dx,dy] of [[1,0],[0,1]]){const r=runAt(m2,x,y,dx,dy);if(r.length>4)return false;if(r.length>1)runs.push(r)}
  if(!runs.length)return true;
  if(runs.some(r=>r.some(([a,b])=>m2[K(a,b)].j)))return true;
  for(const id of IDENT){m2[k]=id;if(runs.every(r=>!lineFail(r.map(([a,b])=>m2[K(a,b)]))))return true}
  return false;
}
// replace board joker at key with card; returns true if all lines stay valid
function recycleOK(board,key,card){
  const m=Object.assign({},board);m[key]=card;const [x,y]=P(key);
  const map=new Map();addRun(map,m,x,y,1,0);addRun(map,m,x,y,0,1);jokerLines(m,map);
  return checkLines([...map.values()].map(r=>r.map(([a,b])=>m[K(a,b)]))).ok;
}
// o: {played:[cards], cells:[keys], bonus:{key:'p10'|'x2'}, kids, target, powerX2, allFour, ending}
function scoreTurn(an,o){
  const parts=[];
  if(o.kids){
    let t=an.teams+(o.allFour?1:0)+(o.ending?1:0);
    if(an.teams)parts.push(['team','+'+an.teams]);
    if(o.allFour)parts.push(['four','+1']);
    if(o.ending)parts.push(['end','+1']);
    return {total:t,parts};
  }
  let add=0,mult=1,base=an.base;
  if(o.noPairs&&an.sums)base=an.sums.filter(l=>l.len>=3).reduce((a,l)=>a+l.pts,0);
  parts.push(['lines','+'+base]);
  if(o.cross&&an.cross){add+=5*an.cross;parts.push(['cross','+'+5*an.cross])}
  if(o.target){
    const tg=o.target;let hits=0;
    for(const a of ['c','s','n'])if(o.played.some(c=>!c.j&&c[a]===tg[a]))hits++;
    if(hits){add+=5*hits;parts.push(['target','+'+5*hits])}
    if(o.played.some(c=>!c.j&&c.c===tg.c&&c.s===tg.s&&c.n===tg.n)){mult*=2;parts.push(['target','×2'])}
  }
  for(const k of o.cells){const b=o.bonus&&o.bonus[k];if(b==='p10'){add+=10;parts.push(['cell','+10'])}if(b==='x2'){mult*=2;parts.push(['cell','×2'])}}
  for(let i=0;i<an.teams;i++){mult*=2;parts.push(['team','×2'])}
  if(o.allFour){mult*=2;parts.push(['four','×2'])}
  if(o.ending){mult*=2;parts.push(['end','×2'])}
  if(o.powerX2){mult*=2;parts.push(['power','×2'])}
  return {total:(base+add)*mult,parts};
}

zh:`<ol class="rules"><li><b>目标：</b>把牌接到桌上的线上，得分最多的人赢。</li><li><b>线：</b>同一行或同一列的 2–4 张牌。<b>颜色</b>、<b>花色</b>（筒 条 万 风）和<b>数字</b>：每一项要么全相同，要么全不同。</li><li><b>你的回合：</b>放 1–4 张牌，可以放在不同的线上，每张都要直接或通过新放的牌连接桌上的牌；或者“过”，并可以换任意张牌。</li><li><b>变体规则（设置里）：</b>两张的线不得分；交叉奖励：一张牌同时在三张以上的行和列里 +5；必须成三：每轮至少形成一条三张以上的线。</li><li><b>计分：</b>新形成或延长的每条线上的数字加起来。一张牌在两条线上就算两次。每完成一条四连 ×2，四张牌全出 ×2。</li><li><b>花牌</b>可以代替任何牌，0 分。出牌前可以用手里合适的牌把桌上的花牌换回来。</li><li><b>结束：</b>牌堆用完后，打出手里最后一张牌的人结束游戏（本轮 ×2）。两人游戏时每人连续过两次、三四人时每人连续过一次，游戏也结束。</li><li><b>骰子：</b>每个玩家每种骰子整局只能掷一次，什么时候掷都可以，但每轮最多掷一个。目标骰、能力骰、奖励骰要在放牌前掷；风险骰在确认出牌后掷。目标骰：打出的牌每符合一项 +5，一张完全符合 ×2。风险骰：4–6 翻倍，1–3 零分。奖励骰：1–3 出现 +10 格，4–6 出现 ×2 格。</li></ol>`,
en:`<ol class="rules"><li><b>Goal:</b> add tiles to lines on the table and score the most points.</li><li><b>Line:</b> 2–4 tiles in a row or column. <b>Color</b>, <b>suit</b> (筒 条 万 风) and <b>number</b>: each must be all the same or all different.</li><li><b>Your turn:</b> place 1–4 tiles, in as many different lines as you like; every tile must connect to the table directly or through your other new tiles, or pass and swap any number of tiles.</li><li><b>House rules (in settings):</b> pairs score nothing; cross bonus: +5 for each tile in both a 3+ row and a 3+ column; must make 3: every turn must form a line of 3 or more.</li><li><b>Scoring:</b> add the numbers of every line you created or extended. A tile in two lines counts twice. Each completed 4-line ×2, playing all four tiles ×2.</li><li><b>Flower 花</b> tiles stand for any tile and score 0. Before playing you may swap a fitting tile from your hand for a flower on the table.</li><li><b>End:</b> once the deck is empty, whoever plays their last tile ends the game (that turn ×2). The game also ends if every player passes twice in a row (2 players) or once in a row (3–4 players).</li><li><b>Dice:</b> each player may roll each die once per game, on any turn, but at most one die per turn. Target, power and bonus dice are rolled before placing tiles; the risk die after confirming your move. Target: +5 per trait matched by a played tile, ×2 for an exact match. Risk: 4–6 double, 1–3 zero. Bonus: 1–3 a +10 spot, 4–6 a ×2 spot.</li></ol>`,
tr:`<ol class="rules"><li><b>Amaç:</b> masadaki çizgilere taş ekleyerek en çok puanı toplamak.</li><li><b>Çizgi:</b> düz bir sıra ya da sütunda 2–4 taş. <b>Renk</b>, <b>takım</b> (筒 条 万 风) ve <b>sayı</b>: her biri ya hepsinde aynı ya hepsinde farklı olmalı.</li><li><b>Turunda:</b> 1–4 taş koy; istediğin kadar farklı çizgiye koyabilirsin, her taş masaya doğrudan ya da yeni koyduğun taşlar üzerinden bağlı olmalı; ya da pas geç ve istediğin kadar taş değiştir.</li><li><b>Ek kurallar (ayarlardan):</b> 2'li çizgi puansız; kesişme bonusu: hem 3+ sıra hem 3+ sütundaki her taş +5; 3'lü zorunlu: her tur en az bir 3+ çizgi kurulmalı.</li><li><b>Puan:</b> oluşturduğun ya da uzattığın her çizgideki sayıların toplamı. İki çizgide yer alan taş iki kez sayılır. Her 4'lü çizgi ×2, 4 taşın hepsini oynamak ×2.</li><li><b>花 çiçek</b> taşı her taşın yerine geçer, 0 puan. Hamle yapmadan önce elindeki uygun bir taşla masadaki çiçeği değiştirip alabilirsin.</li><li><b>Bitiş:</b> deste bittikten sonra elindeki son taşı oynayan oyunu bitirir (o tur ×2). 2 kişide herkes art arda ikişer, 3–4 kişide birer kez pas geçerse de oyun biter.</li><li><b>Zarlar:</b> her oyuncu her zarı oyun boyunca bir kez, istediği turda atabilir; bir turda en fazla bir zar. Hedef, güç ve bonus zarı taş koymadan önce, risk zarı hamleni onaylayınca atılır. Hedef: oynanan taşlarda eşleşen her özellik +5, tam eşleşen taş ×2. Risk: 4–6 ×2, 1–3 sıfır. Bonus: 1–3 +10 kare, 4–6 ×2 kare.</li></ol>`
};

function hand(){return S.hands[S.cur]}
const isAI=i=>!!(S&&S.players[i]&&S.players[i].ai);

function scoreCtx(an,pend){

/* ---------------- AI ---------------- */
const AI_CFG={e:{beam:2,depth:2,die:.12},m:{beam:4,depth:3,die:.25},x:{beam:20,depth:4,die:.35}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function aiEval(np,an,lvl){
  let v=scoreCtx(an,np).total;
  // bots shouldn't lean on lines where every trait differs: make those moves less attractive
  {const h0=hand(),mm=Object.assign({},S.board);for(const p of np)mm[K(p.x,p.y)]=h0.find(c=>c.id===p.id);
   let odd=0;for(const r of an.lines){if(r.length<3)continue;const cs=r.map(([x,y])=>mm[K(x,y)]).filter(c=>!c.j);
     if(cs.length>=2&&['c','s','n'].every(a=>new Set(cs.map(c=>c[a])).size===cs.length))odd++}
   if(odd)v*=Math.pow(.55,odd)}
  if(lvl!=='x')return v;
  const h=hand(),m=Object.assign({},S.board);for(const p of np)m[K(p.x,p.y)]=h.find(c=>c.id===p.id);
  // don't waste flowers on small moves
  const jk=np.filter(p=>m[K(p.x,p.y)].j).length;if(jk&&v<40)v-=10*jk;
  // avoid leaving a 3-line the next player can finish into a doubling 4-line
  for(const r of an.lines)if(r.length===3){const [a,b]=[r[0],r[2]],hz=a[1]===b[1];
    const ends=hz?[[a[0]-1,a[1]],[b[0]+1,b[1]]]:[[a[0],a[1]-1],[b[0],b[1]+1]];
    if(ends.some(([x,y])=>!m[K(x,y)]&&cellAlive(m,x,y)))v-=6}
  return v;
}
// beam search over placements of hand tiles (any number of lines, like a human may)
function aiCandidates(lvl){
  const {beam,depth}=AI_CFG[lvl],h=hand(),byId={};h.forEach(c=>byId[c.id]=c);
  const out=[],seen=new Set();let layer=[[]];
  for(let d=0;d<Math.min(depth,h.length);d++){
    const next=[];
    for(const part of layer){
      const used=new Set(part.map(p=>p.id)),m=Object.assign({},S.board);for(const p of part)m[K(p.x,p.y)]=byId[p.id];
      const cells=new Set();for(const key in m){const [x,y]=P(key);for(const [dx,dy] of D4){const kk=K(x+dx,y+dy);if(!m[kk])cells.add(kk)}}
      const kinds=new Set();
      for(const c of h){if(used.has(c.id))continue;const kind=c.j?'j':c.s+'-'+c.n+'-'+c.c;if(kinds.has(kind))continue;kinds.add(kind);
        for(const kk of cells){const [x,y]=P(kk),np=part.concat([{x,y,id:c.id}]);
          const sig=np.map(p=>p.id+'@'+p.x+','+p.y).sort().join('|');if(seen.has(sig))continue;seen.add(sig);
          const an=analyze(S.board,np.map(p=>({x:p.x,y:p.y,card:byId[p.id]})));if(!an.ok)continue;
          next.push({pend:np,an,val:aiEval(np,an,lvl)})}}
    }
    if(!next.length)break;
    next.sort((a,b)=>b.val-a.val);out.push(...next);layer=next.slice(0,beam).map(n=>n.pend);
  }
  return S.cfg.hMust3?out.filter(c=>c.an.lines.some(r=>r.length>=3)):out;
}
function aiChoose(lvl){
  const c=aiCandidates(lvl);if(!c.length)return null;
  if(lvl==='e'){const pool=c.slice().sort((a,b)=>a.val-b.val).slice(0,Math.max(3,Math.ceil(c.length*.6)));return pool[Math.floor(Math.random()*pool.length)]}
  if(lvl==='m'){c.sort((a,b)=>b.val-a.val);const top=c.slice(0,Math.max(3,Math.ceil(c.length*.35)));return top[Math.floor(Math.random()*top.length)]}
  c.sort((a,b)=>b.val-a.val);return c[0];
}
function aiFits(card){for(const key in S.board){const [x,y]=P(key);for(const [dx,dy] of D4){if(S.board[K(x+dx,y+dy)])continue;if(analyze(S.board,[{x:x+dx,y:y+dy,card}]).ok)return true}}return false}
function aiExchangeIds(lvl){
  if(!S.deck.length)return [];const h=hand();
  if(lvl==='e')return Math.random()<.5?[]:h.map(c=>c.id);
  const bad=h.filter(c=>!c.j&&!aiFits(c));
  return (bad.length?bad:h.filter(c=>!c.j)).map(c=>c.id);
}
function aiRisk(){
  const lvl=S.players[S.cur].ai,ps=S.turn.pendingScore,me=S.players[S.cur].score;
  const lead=Math.max(...S.players.filter((_,i)=>i!==S.cur).map(p=>p.score));
  const go=lvl==='e'?Math.random()<.5:lvl==='m'?Math.random()<.35:(lead-me>ps.total||ps.total<12);
  if(!go){setTimeout(()=>finishScore(1,null),500);return}
  showRisk();const rr=document.getElementById('rrow');if(rr)rr.style.visibility='hidden';setTimeout(riskGo,800);
}
async function aiTurn(){
  if(UI.aiRun||S.phase!=='play'||!isAI(S.cur)||S.turn.pendingScore)return;
  UI.aiRun=true;const me=S.cur,lvl=S.players[me].ai,turn=S.turnNo;
  const still=()=>S.phase==='play'&&S.cur===me&&S.turnNo===turn&&UI.screen==='game';
  try{
    UI.pend=[];render();await sleep(650);if(!still())return;
    // maybe roll one die before playing
    const ks=['t','p','b'].filter(k=>dieState(k)==='ok');
    if(ks.length&&Math.random()<AI_CFG[lvl].die){const k=ks[Math.floor(Math.random()*ks.length)];showDieRoll(k);await sleep(450);dieRoll({k});await sleep(1700);closeOv();render();await sleep(250);if(!still())return}
    const tr=S.turn,h=hand();
    // extra-swap power: trade a tile that fits nowhere
    if(lvl!=='e'&&tr.power==='swap'&&!tr.swapUsed&&S.deck.length){const bad=h.find(c=>!c.j&&!aiFits(c));if(bad){const i=h.indexOf(bad);S.deck.unshift(bad);h[i]=S.deck.pop();tr.swapUsed=true;takeSnap();save()}}
    // hard: pick up a flower from the table when a hand tile can replace it
    if(lvl==='x'){outer:for(const key in S.board){if(!S.board[key].j)continue;for(const c of h){if(c.j||!recycleOK(S.board,key,c))continue;const j=S.board[key];S.board[key]=c;h[h.indexOf(c)]=j;UI.lastPlaced=new Set([c.id]);sfx('place');takeSnap();save();render();await sleep(500);break outer}}}
    await sleep(30);
    const mv=aiChoose(lvl);if(!still())return;
    if(!mv){await sleep(400);UI.aiRun=false;doPass(aiExchangeIds(lvl));return}
    for(const p of mv.pend){UI.pend.push(p);UI.lastPlaced=new Set([p.id]);sfx('place');render();await sleep(430);if(!still())return}
    await sleep(650);if(!still())return;
    UI.aiRun=false;confirmMove(true);
  }finally{UI.aiRun=false}
}

/* ---------------- flow steps (resumable) ---------------- */
function step(){
  closeOv();
  if(!S||UI.screen!=='game')return;
  if(S.phase==='startroll'){showStartRoll();return}
  if(S.phase==='over'){if(!UI.viewing)showOver();else render();return}
  const tr=S.turn;
  if(tr.pendingScore){if(tr.pendingScore.risk){if(isAI(S.cur))aiRisk();else showRisk()}else finishScore(1,null);return}
  if(isAI(S.cur)){if(!tr.rev)tr.rev=true;if(!tr.snap){takeSnap();save()}render();setTimeout(aiTurn,60);return}
  if(!tr.rev){if(humans().length>1){showPassScreen();return}tr.rev=true;save()}
  if(!tr.snap){takeSnap();save()}
  render();
}

const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};

// spec: [{id,kind,val}] -> animate then call cb
function animDice(spec,cb){
  UI.busy=true;sfx('dice');const t0=Date.now();

function boardImageSVG(){
  const ks=Object.keys(S.board);let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const k of ks){const [x,y]=P(k);x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}
  const pad=28,head=S.players.length>2?150:128,bw=(x1-x0+1)*CW-4,bh=(y1-y0+1)*CH;
  const W=Math.max(bw+pad*2+20,380),H=bh+pad*2+head+10,ox=(W-bw)/2;
  const ff=`font-family="PingFang SC,Noto Sans SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif"`;
  let g=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="iv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#ead9b0"/></linearGradient><radialGradient id="fe" cx=".5" cy=".45" r=".8"><stop offset="0" stop-color="#2f7356"/><stop offset="1" stop-color="#173b2c"/></radialGradient></defs>`;
  g+=`<rect width="${W}" height="${H}" fill="#3b1f14"/><rect x="10" y="${head}" width="${W-20}" height="${H-head-10}" rx="16" fill="url(#fe)"/>`;
  g+=`<text x="${W/2}" y="46" text-anchor="middle" font-size="36" font-weight="900" fill="#ffe9a8" ${ff}>四风</text>`;
  const ps=S.players.map(p=>p).slice().sort((a,b)=>b.score-a.score);
  const tie=ps.length>1&&ps[0].score===ps[1].score;
  g+=`<text x="${W/2}" y="76" text-anchor="middle" font-size="17" font-weight="800" fill="#ffd34d" ${ff}>${tie?esc(t('draw')):'👑 '+esc(ps[0].name)+' '+esc(t('won'))}</text>`;
  const line=ps.map(p=>esc(p.name)+' '+p.score);
  for(let i=0;i<line.length;i+=2)g+=`<text x="${W/2}" y="${102+i/2*22}" text-anchor="middle" font-size="15" fill="#f5e9d0" ${ff}>${line.slice(i,i+2).join('   ·   ')}</text>`;
  const d=new Date(),ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  g+=`<text x="${W-18}" y="${H-18}" text-anchor="end" font-size="11" fill="#ffffff66" ${ff}>${ds}</text>`;
  for(const k of ks){const [x,y]=P(k),X=ox+(x-x0)*CW,Y=head+pad+(y-y0)*CH,inner=tileSVG(S.board[k]).replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'');
    g+=`<rect x="${X}" y="${Y+3}" width="54" height="70" rx="7" fill="#1f6e4c"/><rect x="${X}" y="${Y}" width="54" height="70" rx="7" fill="url(#iv)"/><svg x="${X}" y="${Y}" width="54" height="70" viewBox="0 0 54 70" ${ff}>${inner}</svg>`}
  return {svg:g+'</svg>',W,H};
}
function boardImage(){
  return new Promise((res,rej)=>{
    const {svg,W,H}=boardImageSVG(),sc=Math.min(2,4096/Math.max(W,H));
    const img=new Image();
    img.onload=()=>{const c=document.createElement('canvas');c.width=Math.round(W*sc);c.height=Math.round(H*sc);const x=c.getContext('2d');x.scale(sc,sc);x.drawImage(img,0,0);c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/png')};
    img.onerror=rej;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  });
}

  fit(){fitCam()},
  zoom(d){const b=document.getElementById('board'),f=+d.v,z0=UI.cam.z,z=Math.max(.3,Math.min(2.5,z0*f)),cx=b.clientWidth/2,cy=b.clientHeight/2;UI.cam={z,x:cx-(cx-UI.cam.x)*z/z0,y:cy-(cy-UI.cam.y)*z/z0};applyCam()},
  setLang(d){PREF.lang=d.v;document.documentElement.lang=d.v;savePref();rerenderAll()},
  togPy(){PREF.py=!PREF.py;savePref();rerenderAll()},
  togSnd(){PREF.snd=!PREF.snd;savePref();try{HOST&&HOST.setSound(PREF.snd)}catch(e){}sfx('tap');rerenderAll()},
  cfgN(d){UI.cfg.n=+d.v;renderSetup()},
  cfgHalf(d){UI.cfg.half=d.v==='1';renderSetup()},
  cfgKids(d){UI.cfg.kids=d.v==='1';renderSetup()},
  cfgTog(d){UI.cfg[d.k]=!UI.cfg[d.k];renderSetup()},
  startGame(){collectNames();ac();document.getElementById('app').innerHTML='';newGame();step()},
  resume(){closeOv();UI.screen='game';document.getElementById('app').innerHTML='';render();step()},
  toHome(){if(UI.screen==='setup')collectNames();closeOv();UI.screen='home';document.getElementById('app').innerHTML='';render()},
  viewBoard(){closeOv();UI.viewing=true;UI.needFit=true;render()},
  showOver(){showOver()},
  snap(){snapBoard()},
  imgClose(){closeOv();if(S.phase==='over'&&!UI.viewing)showOver()},
  imgDl(){const a=document.createElement('a');a.href=UI.imgURL;a.download=UI.imgName;document.body.appendChild(a);a.click();a.remove()},
  imgShare(){try{navigator.share({files:[new File([UI.imgBlob],UI.imgName,{type:'image/png'})],title:'四风'}).catch(()=>{})}catch(e){}},
  toSetup(){closeOv();UI.screen='setup';document.getElementById('app').innerHTML='';render()},
  again(){closeOv();UI.cfg=Object.assign({},S.cfg);PREF.names=S.players.map(p=>p.name);savePref();document.getElementById('app').innerHTML='';newGame();step()}
};
function collectNames(){document.querySelectorAll('[data-ni]').forEach(i=>PREF.names[+i.dataset.ni]=i.value);savePref()}
function rerenderAll(){
  const inSettings=!!(ovEl&&ovEl.querySelector('[data-a="togSnd"]'));
  if(UI.screen==='setup'){collectNames();renderSetup();return}
  if(UI.screen==='home'||!S){if(inSettings)showSettings();else render();return}
  render();if(inSettings)showSettings();
}
document.addEventListener('change',e=>{const el=e.target.closest('[data-ty]');if(!el)return;UI.cfg.types=(UI.cfg.types||['h','h','h','h']).slice();UI.cfg.types[+el.dataset.ty]=el.value;renderSetup()});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  if(el.disabled)return;const a=ACT[el.dataset.a];if(a)a(el.dataset,el);
});
window.addEventListener('resize',()=>applyCam());
document.documentElement.lang=PREF.lang;

/* ---------------- boot ---------------- */
UI.screen='home';render();
<%/script%>
</body>
</html>
